name: Fetch official member candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/fetch_official.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-candidates-for-review
          path: reports/
